# ── Cloudflare R2 Storage ─────────────────────────────────────────────
r2.endpoint=https://56109a941c2f5386b35510659185b275.r2.cloudflarestorage.com
r2.bucket=aura-pos
r2.public-url=https://pub-93a6debb84604fb5821f1eaf26a254a2.r2.dev
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}

# Multipart — máx 10MB por imagen
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del servidor
server.port=${SERVER_PORT}

# ── Caja — roles autorizados para cerrar turno ────────────────────────
# Lista separada por comas. Si no se define, solo ADMIN y SUPER_ADMIN pueden cerrar.
app.caja.roles-cierre=ADMIN,SUPER_ADMIN
#
#
# Configuración de JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# En producción queda apagado: cada consulta impresa lleva datos de clientes,
# montos y documentos a los logs. Para depurar en local: JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# ADR-005: el esquema lo define la migración (hoy la de Laravel, ver abajo);
# Hibernate solo valida. Jamás volver a 'update': si Hibernate puede crear
# columnas, el esquema deja de ser reproducible y las dos BD divergen.
spring.jpa.hibernate.ddl-auto=validate

# ── Flyway ────────────────────────────────────────────────────────────
# APAGADO a propósito: el esquema lo aplica el proyecto de migraciones en
# Laravel (aura-pos-migracion-old). Con Flyway encendido se migraba dos veces
# —una por cada proyecto— y cualquier retoque a un .sql ya aplicado tumbaba el
# arranque con "checksum mismatch" aunque el esquema estuviera correcto.
#
# Los .sql de db/migration se mantienen como espejo/documentación del esquema,
# pero NO se ejecutan: para aplicar un cambio, corre su migración en Laravel.
# Hibernate sigue en 'validate' (abajo), así que si a la BD le falta algo que
# una entidad declara, la app no arranca — la red de seguridad sigue puesta.
#
# Para volver a activarlo: enabled=true. Ojo, habrá que hacer `flyway repair`
# porque el historial quedará desalineado con lo aplicado desde Laravel.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=84
# ── Llaves criptográficas ─────────────────────────────────────────────
# NUNCA escribir el valor aquí: este archivo está versionado en git.
# Con app.jwt.secret se firma cualquier token (empresaId + rol a voluntad).
#
#   JWT_SECRET  -> base64:  openssl rand -base64 64
#   AES_KEY     -> base64:  openssl rand -base64 32   (AESencryptUtil hace
#                           Base64.getDecoder(), no hex)
#
# Sin estas variables la aplicación NO arranca, y así debe ser.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:259200000}
app.aes.key=${AES_KEY}

app.frontend.url=${FRONTEND_URL}

# ── Seguridad · límite de peticiones (fase 0 del plan) ────────────────
# Protege /api/auth/** de fuerza bruta. Ventana fija por IP.
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.max-attempts=${RATE_LIMIT_MAX:5}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW:60}
# true  = detrás de nginx/Cloudflare, la IP real viene en X-Forwarded-For.
# false = la app está expuesta directo; se usa la IP del socket.
# Si está en true y la app NO está detrás de un proxy, un atacante evade el
# límite falsificando la cabecera. Si está en false y SÍ hay proxy, todos los
# usuarios comparten un mismo contador y se bloquean entre ellos.
app.security.rate-limit.trust-forwarded-header=${RATE_LIMIT_TRUST_PROXY:true}

# ── Seguridad · documentación de la API ───────────────────────────────
# Swagger publica el catálogo completo de endpoints. Solo en desarrollo.
app.swagger.enabled=${SWAGGER_ENABLED:false}

# ── Factus (Facturación electrónica) ─────────────────────────────────
# URL base del ambiente. Sandbox por defecto; en producción usar:
#   https://api.factus.com.co
factus.api.base-url=${FACTUS_API_BASE_URL}


# ── Resilience4j Circuit Breaker ─────────────────────────────────────

# CB: factus-token (autenticación — más tolerante)
resilience4j.circuitbreaker.instances.factus-token.sliding-window-size=5
resilience4j.circuitbreaker.instances.factus-token.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.factus-token.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.factus-token.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.factus-token.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.factus-token.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.factus-token.register-health-indicator=true

# CB: factus-bill (generar factura — más estricto)
resilience4j.circuitbreaker.instances.factus-bill.sliding-window-size=10
resilience4j.circuitbreaker.instances.factus-bill.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.factus-bill.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.factus-bill.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.factus-bill.slow-call-duration-threshold=8s
resilience4j.circuitbreaker.instances.factus-bill.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.factus-bill.register-health-indicator=true

# ── Resilience4j Retry ────────────────────────────────────────────────

# Retry: factus-token (3 intentos, backoff exponencial 1s → 2s → 4s)
resilience4j.retry.instances.factus-token.max-attempts=3
resilience4j.retry.instances.factus-token.wait-duration=1s
resilience4j.retry.instances.factus-token.enable-exponential-backoff=true
resilience4j.retry.instances.factus-token.exponential-backoff-multiplier=2
resilience4j.retry.instances.factus-token.retry-exceptions[0]=java.net.SocketTimeoutException
resilience4j.retry.instances.factus-token.retry-exceptions[1]=java.net.ConnectException
resilience4j.retry.instances.factus-token.retry-exceptions[2]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.factus-token.retry-exceptions[3]=org.springframework.web.client.HttpServerErrorException

# Retry: factus-bill (2 intentos — conservador para evitar facturas duplicadas)
resilience4j.retry.instances.factus-bill.max-attempts=2
resilience4j.retry.instances.factus-bill.wait-duration=2s
resilience4j.retry.instances.factus-bill.retry-exceptions[0]=java.net.SocketTimeoutException
resilience4j.retry.instances.factus-bill.retry-exceptions[1]=java.net.ConnectException
resilience4j.retry.instances.factus-bill.retry-exceptions[2]=org.springframework.web.client.ResourceAccessException

# Retry: factus-nomina (Fase 5)
# 1 intento (sin retry): la validación DIAN de nómina tarda y un reintento tras
# un read-timeout podría duplicar el documento si Factus alcanzó a procesarlo.
# Se prefiere darle tiempo (RestTemplate dedicado, 45s) y no reintentar solo.
resilience4j.retry.instances.factus-nomina.max-attempts=1
resilience4j.retry.instances.factus-nomina.wait-duration=2s
resilience4j.retry.instances.factus-nomina.retry-exceptions[0]=java.net.ConnectException

# CB: factus-nomina (mismos umbrales que factus-bill)
resilience4j.circuitbreaker.instances.factus-nomina.sliding-window-size=10
resilience4j.circuitbreaker.instances.factus-nomina.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.factus-nomina.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.factus-nomina.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.factus-nomina.slow-call-duration-threshold=8s
resilience4j.circuitbreaker.instances.factus-nomina.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.factus-nomina.register-health-indicator=true

# ── Resilience4j TimeLimiter ──────────────────────────────────────────
resilience4j.timelimiter.instances.factus-token.timeout-duration=5s
resilience4j.timelimiter.instances.factus-bill.timeout-duration=10s
resilience4j.timelimiter.instances.factus-nomina.timeout-duration=10s

# ── Actuator — health y métricas de los circuit breakers ─────────────
management.endpoints.web.exposure.include=health,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
# Factus panel admin (get-bills, reportes)
factus.admin.base-url=${FACTUS_ADMIN_BASE_URL:https://app.factus.com.co/administrador}
